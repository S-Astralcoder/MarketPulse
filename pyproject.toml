[project]
name = "marketpulse"
version = "0.1.0"
description = "A Fullstack application build to provide organized maker status to make better decisions when investing or trading."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.1",
    "fastapi[standard]>=0.143.0",
    "pydantic>=2.13.5",
    "sqlalchemy[asyncio]>=2.1.4",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "ruff>=0.16.10",
]

[tool.fastapi]
entrypoint="src.app:app"


