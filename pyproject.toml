[project]
name = "marketpulse"
version = "0.1.0"
description = "A Fullstack application build to provide organized maker status to make better decisions when investing or trading."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.143.0",
    "sqlalchemy>=2.1.4",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pyrefly>=1.3.2",
    "ruff>=0.16.10",
]

[tool.fastapi]
entrypoint="src.app:app"
