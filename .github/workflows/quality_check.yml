name: Quality Check CI

on:
    push:
        branches : [main]
    pull_request:
        branches : [main]

jobs:
    ruff:
        name: Linter & Formater (ruff)
        runs-on: ubuntu-latest

        steps:
            - name: CheckOut Repo
              uses: actions/checkout@v4

            - name: Install uv
              uses: astral-sh/setup-uv@v7
              with:
                enable-cache: true

            - name: Ruff Formatter
              run: uvx ruff format --check src

            - name: Ruff Linter
              run: uvx ruff check --output-format=github src

    pyright:
        name: Pyright TypeChecker
        runs-on: ubuntu-latest
        steps:
            - name: CheckOut Repo
              uses: actions/checkout@v4

            - name: Install uv
              uses: astral-sh/setup-uv@v7
              with:
                enable-cache: true

            - name: Set up Python
              run: uv python install

            - name: Install dependencies
              run: uv sync --frozen --dev

            - name: Run Pyright
              run: uv run pyright src
