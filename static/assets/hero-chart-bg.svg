      <text x="20" y="14" fill="#E06C75">RISK_LIMIT: ATR_SPIKE [+2.8σ]</text>
      <line x1="40" y1="20" x2="40" y2="35" stroke="#E06C75" stroke-width="1" stroke-dasharray="2 2" />
    </g>

